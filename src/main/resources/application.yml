server.port: 8080

spring.application.name: chess-lab

logging:
  level:
    com.github.chesslab: INFO

chess:
  ai:
    # 具名连接池。棋手通过 provider 字段引用其中一条（必填），不同棋手可以分属不同服务商
    providers:
      claude:
        type: anthropic
        # 留空走官方地址，填上可走中转
        base-url: ${ANTHROPIC_BASE_URL:}
        api-key: ${ANTHROPIC_API_KEY:}
        # 是否开启扩展思考，只有 anthropic 这条路认。默认关：从候选编号里挑一个用不上长链推理，
        # 开了每一手要多等十几秒。想对比棋力差异再打开；effort 想配到 xhigh/max 也必须一起打开，
        # 否则官方模型会直接返回 400
        thinking: ${ANTHROPIC_THINKING:false}
      gpt:
        type: openai
        base-url: ${OPENAI_BASE_URL:}
        api-key: ${OPENAI_API_KEY:}
    # 一场对局最多两个 AI：人机对战挑其中一个当对手，观战模式就是这两个互下。
    # 两个席位完全对等，唯一的区别是各自指向哪条连接、哪个模型。
    players:
      - id: qingyun
        name: 青云
        code: QINGYUN
        provider: gpt
        model: mimo-v2.6-flash
        # 候选着法的合法性已由后端算好，模型只需从二十来个编号里挑一个。
        # 这个值别乱动：实测 mimo 在 low 档一手棋花了 887 秒，34186 个输出 token 里
        # 34152 个是思考，答案只有 34 个——它的 low 不是别家的 low。
        # mimo 的几档实测：none 关掉思考，快但棋力太差；minimal 直接返 400；
        # medium 和 low 的思考长度差不多，只是更慢一点。所以留在 low。
        # 压思考长度靠的是 PromptBuilder 里的思考节奏和判定式规则，不是这个字段；
        # 嫌慢或嫌棋臭，调的是 PromptBuilder 的 QUIET_CHAR_BUDGET / CONTACT_CHAR_BUDGET。
        effort: low
      - id: xuanji
        name: 玄机
        code: XUANJI
        provider: gpt
        model: mimo-v2.6-flash
        effort: low
